<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151412">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; manifest-src 'self'">
  <title>Nancy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="eyebrow">PERSONAL ASSISTANT</div>
        <h1>Nancy</h1>
      </div>
      <div class="header-actions">
        <span id="connection" class="status"><i></i> Connecting</span>
        <button id="settingsButton" class="icon-button" aria-label="Settings">⚙</button>
      </div>
    </header>

    <main id="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="mark">N</div>
        <h2>What should we get done?</h2>
        <p>Type, paste, or use the Mac companion to speak.</p>
      </div>
    </main>

    <div id="activity" class="activity" hidden>
      <span class="loader"></span><span id="activityText">Working on it…</span>
    </div>

    <form id="composer">
      <textarea id="messageInput" rows="1" maxlength="4000"
        placeholder="Message Nancy…" aria-label="Message"></textarea>
      <button id="sendButton" type="submit" aria-label="Send">↑</button>
    </form>
  </div>

  <dialog id="authDialog">
    <form id="authForm" method="dialog" class="dialog-card">
      <div class="eyebrow">CONNECT THIS DEVICE</div>
      <h2>Enter your control key</h2>
      <p>Stored only in this browser. You can revoke it by changing the server key.</p>
      <input id="apiKeyInput" type="password" autocomplete="current-password" required
        placeholder="CONTROL_API_KEY">
      <button type="submit" class="primary">Connect</button>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form id="settingsForm" method="dialog" class="dialog-card settings-card">
      <div class="dialog-heading">
        <div><div class="eyebrow">VOICE SETTINGS</div><h2>Companion</h2></div>
        <button type="button" id="closeSettings" class="icon-button">×</button>
      </div>
      <label>Wake word<input id="wakeWord" required maxlength="40"></label>
      <label>Mac keyboard trigger
        <select id="keyboardTrigger">
          <option value="rightOption">Double-tap Right Option</option>
          <option value="leftOption">Double-tap Left Option</option>
          <option value="disabled">Disabled</option>
        </select>
      </label>
      <div class="two-column">
        <label>Voice
          <select id="ttsVoice">
            <option value="af_heart">Heart · American</option>
            <option value="af_bella">Bella · American</option>
            <option value="af_nova">Nova · American</option>
            <option value="bf_emma">Emma · British</option>
            <option value="bm_george">George · British</option>
            <option value="am_adam">Adam · American</option>
          </select>
        </label>
        <label>Speed<input id="ttsSpeed" type="number" min="0.6" max="1.5" step="0.05"></label>
      </div>
      <label>Pause before sending (seconds)
        <input id="endSilenceSeconds" type="number" min="0.5" max="3" step="0.1">
      </label>
      <label>Acknowledgements
        <textarea id="ackPhrases" rows="6" placeholder="One phrase per line"></textarea>
      </label>
      <label>Listening cues
        <textarea id="activationPhrases" rows="4" placeholder="One phrase per line"></textarea>
      </label>
      <label>Stop-listening phrases
        <textarea id="stopPhrases" rows="5" placeholder="One phrase per line"></textarea>
      </label>
      <label>Stop-speaking phrases
        <textarea id="silencePhrases" rows="4" placeholder="One phrase per line"></textarea>
      </label>
      <label class="switch-row">
        <span><strong>Browser speech</strong><small>Use system speech when the native companion is absent</small></span>
        <input id="browserSpeech" type="checkbox">
      </label>
      <button type="submit" class="primary">Save settings</button>
      <button type="button" id="forgetKey" class="danger">Disconnect this device</button>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
